name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy type check
        run: uv run mypy src/academic_cluster/

      - name: Build wheel
        run: uv build --wheel

      - name: Verify migration SQL is packaged
        run: uv run python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0]; assert 'academic_cluster/sql/migrate_agent_tables.sql' in zipfile.ZipFile(wheel).namelist()"

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: academic_cluster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: academic_cluster_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      ACADEMIC_CLUSTER_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/academic_cluster_test
      LANGGRAPH_STRICT_MSGPACK: "true"
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      APP_SECRET_KEY: test-app-secret-key-for-ci-only
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize database schema
        env:
          PGPASSWORD: test
        run: psql -h localhost -U postgres -d academic_cluster_test -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      - name: Run unit tests
        run: uv run pytest tests/unit/ -m "not integration and not live" -v --tb=short --cov=academic_cluster --cov-report=xml --cov-report=term-missing

      - name: Run PostgreSQL integration tests
        run: uv run pytest tests/integration/ -m "integration and not live" -v --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Bandit security scan
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Pip audit
        run: uv run pip-audit

  node-contract-eval:
    name: Node Contract & Promptfoo Evaluation
    runs-on: ubuntu-latest
    needs: python-lint
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Check generated node contracts
        run: uv run python scripts/export_node_contracts.py --check

      - name: Run deterministic Promptfoo acceptance
        working-directory: promptfoo
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npx --yes promptfoo@0.121.19 eval --config promptfooconfig.yaml --no-cache

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build & Lint
    runs-on: ubuntu-latest
    needs: [python-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Hadolint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3008

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: academic-cluster:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: academic-cluster-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
