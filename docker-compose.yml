services:
  # =============================================================================
  # PostgreSQL with pgvector
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    container_name: academic-cluster-postgres
    restart: unless-stopped
    shm_size: '256mb'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_cluster}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - wal_buffers=16MB
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-academic_cluster}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - academic-cluster-network
    pids_limit: 256

  # =============================================================================
  # Redis Cache
  # =============================================================================
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: academic-cluster-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - academic-cluster-network
    pids_limit: 128

  security-migrate:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-academic_cluster}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-academic_app}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?APP_POSTGRES_PASSWORD must be set}
    entrypoint: ["/bin/sh", "/migrations/security-migrate.sh"]
    volumes:
      - ./scripts/migrate_security.sql:/migrations/migrate_security.sql:ro
      - ./docker/postgres/security-migrate.sh:/migrations/security-migrate.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - academic-cluster-network

  # =============================================================================
  # Backend API (FastAPI + LangGraph Agent)
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=gha
        - type=registry,ref=academic-cluster-app:cache
    container_name: academic-cluster-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${APP_POSTGRES_USER:-academic_app}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?APP_POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      security-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - academic-cluster-network
    deploy:
      resources:
        limits:
          memory: 4g
          pids: 512
        reservations:
          memory: 1g

  # =============================================================================
  # Frontend (React + Vite build + Nginx)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: academic-cluster-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      app:
        condition: service_started
    networks:
      - academic-cluster-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
        reservations:
          memory: 64m

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  academic-cluster-network:
    driver: bridge
